apiVersion: v1
kind: Service
metadata:
  name: sins
  namespace: sins-rd
spec:
  type: NodePort
  selector:
    app: sins
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
      nodePort: 30053
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
      nodePort: 30053
