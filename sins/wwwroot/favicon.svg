<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad1)" stroke="#2C5AA0" stroke-width="1"/>
  
  <!-- DNS/Network icon elements -->
  <!-- Central node -->
  <circle cx="16" cy="16" r="3" fill="white"/>
  
  <!-- Connection lines -->
  <line x1="16" y1="13" x2="16" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="19" x2="16" y2="24" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="16" x2="8" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="19" y1="16" x2="24" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Diagonal connections -->
  <line x1="13" y1="13" x2="9" y2="9" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="13" x2="23" y2="9" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="19" x2="9" y2="23" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="19" x2="23" y2="23" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Small connection nodes -->
  <circle cx="16" cy="8" r="1.5" fill="white"/>
  <circle cx="16" cy="24" r="1.5" fill="white"/>
  <circle cx="8" cy="16" r="1.5" fill="white"/>
  <circle cx="24" cy="16" r="1.5" fill="white"/>
  <circle cx="9" cy="9" r="1" fill="white"/>
  <circle cx="23" cy="9" r="1" fill="white"/>
  <circle cx="9" cy="23" r="1" fill="white"/>
  <circle cx="23" cy="23" r="1" fill="white"/>
</svg>
