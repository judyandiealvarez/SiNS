name: Deploy to Production Server (Self-Hosted)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: self-hosted # Use self-hosted runner
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy SiNS
      run: |
        # SiNS Auto-Deployment Script
        echo "=== SiNS Auto-Deployment Started ==="
        
        # Configuration
        DEPLOY_DIR="/home/jaal/ci"
        DOCKER_IMAGE="judyandiealvarez/sins:latest"
        DOCKER_COMPOSE_FILE="$DEPLOY_DIR/docker-compose.yml"
        LOG_FILE="$DEPLOY_DIR/deploy.log"
        
        # Colors for output
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        RED='\033[0;31m'
        BLUE='\033[0;34m'
        NC='\033[0m'
        
        # Logging function
        log() {
            echo -e "${BLUE}[$(date '+%Y-%m-%d %H:%M:%S')]${NC} $1" | tee -a "$LOG_FILE"
        }
        
        log_success() {
            echo -e "${GREEN}[$(date '+%Y-%m-%d %H:%M:%S')] SUCCESS:${NC} $1" | tee -a "$LOG_FILE"
        }
        
        log_warning() {
            echo -e "${YELLOW}[$(date '+%Y-%m-%d %H:%M:%S')] WARNING:${NC} $1" | tee -a "$LOG_FILE"
        }
        
        log_error() {
            echo -e "${RED}[$(date '+%Y-%m-%d %H:%M:%S')] ERROR:${NC} $1" | tee -a "$LOG_FILE"
        }
        
        # Create deployment directory
        mkdir -p "$DEPLOY_DIR"
        cd "$DEPLOY_DIR"
        
        # Copy docker-compose.yml from repository
        log "Copying docker-compose.yml from repository..."
        cp "$GITHUB_WORKSPACE/docker-compose.yml" "$DOCKER_COMPOSE_FILE.tmp"
        
        # Remove version line (obsolete warning)
        sed -i '/^version:/d' "$DOCKER_COMPOSE_FILE.tmp"
        
        # Remove volumes mount for wwwroot (we don't need it)
        sed -i '/      - .\/sins\/wwwroot:\/app\/wwwroot/d' "$DOCKER_COMPOSE_FILE.tmp"
        
        # Move to final location
        mv "$DOCKER_COMPOSE_FILE.tmp" "$DOCKER_COMPOSE_FILE"
        log_success "docker-compose.yml updated successfully"
        
        # Pull latest Docker image
        log "Pulling latest Docker image..."
        docker pull "$DOCKER_IMAGE"
        
        # Stop existing containers
        log "Stopping existing containers..."
        docker compose down || true
        
        # Clean up old images
        log "Cleaning up old images..."
        docker image prune -f || true
        
        # Start services
        log "Starting services with latest image..."
        docker compose up -d
        
        # Wait for services to be healthy
        log "Waiting for services to be healthy..."
        sleep 30
        
        # Check service status
        if docker compose ps | grep -q "healthy"; then
            log_success "Services are healthy!"
        else
            log_warning "Some services may not be healthy yet"
        fi
        
        # Test DNS functionality
        log "Testing DNS functionality..."
        if nslookup google.com 127.0.0.1 > /dev/null 2>&1; then
            log_success "DNS resolution test passed"
        else
            log_error "DNS resolution test failed"
            exit 1
        fi
        
        # Test web interface
        log "Testing web interface..."
        if curl -fs http://127.0.0.1/ > /dev/null 2>&1; then
            log_success "Web interface test passed"
        else
            log_error "Web interface test failed"
            exit 1
        fi
        
        # Show final status
        log "=== Deployment Status ==="
        docker compose ps
        
        log_success "=== SiNS Auto-Deployment Completed Successfully ==="
        echo "🌐 SiNS DNS Server is now running at: http://10.11.2.5"
        echo "🔧 DNS Server: 10.11.2.5:53"
