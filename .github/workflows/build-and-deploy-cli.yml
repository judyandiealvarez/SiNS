name: Build and Deploy SiNS CLI (sns)

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: public
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Setup build environment
      run: |
        sudo apt update
        sudo apt install -y dpkg-dev build-essential fakeroot
        
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          # Extract version from git tag (remove 'cli-v' prefix)
          VERSION=${GITHUB_REF#refs/tags/cli-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
        
    - name: Build CLI application
      run: |
        cd sins-cli
        echo "Current directory: $(pwd)"
        echo "Directory contents:"
        ls -la
        echo "Building .NET application..."
        dotnet restore
        dotnet build -c Release
        echo "Build completed successfully"
        
    - name: Test CLI application
      run: |
        cd sins-cli
        dotnet run -- --help
        
    - name: Build Debian package
      run: |
        cd sins-cli
        echo "Building Debian package..."
        echo "Version: ${{ steps.version.outputs.version }}"
        chmod +x build-package.sh
        ./build-package.sh ${{ steps.version.outputs.version }}
        echo "Package build completed"
        
    - name: Verify package
      run: |
        cd sins-cli
        echo "Package contents:"
        dpkg -c sns_${{ steps.version.outputs.version }}_all.deb
        
        echo "Package information:"
        dpkg -I sns_${{ steps.version.outputs.version }}_all.deb
        
    - name: Build Package Only (Manual Deployment Required)
      run: |
        cd sins-cli
        echo "📦 Package built successfully: sns_${{ steps.version.outputs.version }}_all.deb"
        echo "🔧 Manual deployment required - server 10.11.2.10 is not accessible from GitHub Actions"
        echo "📋 To deploy manually:"
        echo "   1. Download the package artifact from this workflow"
        echo "   2. Upload to your server: scp sns_${{ steps.version.outputs.version }}_all.deb jaal@10.11.2.10:/tmp/"
        echo "   3. Add to repository: ssh jaal@10.11.2.10 'sudo /usr/local/bin/add-package.sh /tmp/sns_${{ steps.version.outputs.version }}_all.deb'"
        
    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: sns-package
        path: sins-cli/sns_${{ steps.version.outputs.version }}_all.deb
        retention-days: 30
        
    - name: Notify build completion
      run: |
        echo "✅ SiNS CLI package built successfully!"
        echo "📦 Package: sns_${{ steps.version.outputs.version }}_all.deb"
        echo "📥 Download from workflow artifacts"
        echo "🔧 Manual deployment required - see workflow logs for instructions"
        echo "🔗 Usage: sns --help"
