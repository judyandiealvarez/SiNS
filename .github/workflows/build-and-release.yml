name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  REGISTRY: docker.io
  IMAGE_NAME: judyandiealvarez/sins

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # For manual dispatch, get all commits
            CHANGELOG=$(git log --oneline --no-merges | head -20)
          else
            # For tag push, get commits since last tag
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            if [ -n "$PREVIOUS_TAG" ]; then
              CHANGELOG=$(git log --oneline --no-merges $PREVIOUS_TAG..HEAD)
            else
              CHANGELOG=$(git log --oneline --no-merges | head -20)
            fi
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: SiNS ${{ steps.get_version.outputs.version }}
          body: |
            ## SiNS (Simple Name Server) ${{ steps.get_version.outputs.version }}
            
            **SiNS** stands for **[Si]mple [N]ame [S]erver** - a complete DNS server solution with web-based management interface.
            
            ### 🚀 What's New
            
            This release includes the following changes:
            
            ```
            ${{ steps.changelog.outputs.changelog }}
            ```
            
            ### 📦 Docker Image
            
            ```bash
            docker pull judyandiealvarez/sins:${{ steps.get_version.outputs.version }}
            ```
            
            ### 🛠️ Quick Start
            
            ```bash
            # Clone the repository
            git clone https://github.com/${{ github.repository }}.git
            cd SiNS
            git checkout ${{ steps.get_version.outputs.version }}
            
            # Deploy
            sudo ./deploy.sh
            ```
            
            ### 📚 Documentation
            
            - [Installation Guide](https://github.com/${{ github.repository }}/blob/main/docs/installation.md)
            - [Quick Start](https://github.com/${{ github.repository }}/blob/main/docs/quick-start.md)
            - [API Reference](https://github.com/${{ github.repository }}/blob/main/docs/api-reference.md)
            
            ### 🔧 Features
            
            - **SiNS Hybrid DNS Server**: Authoritative and recursive DNS server
            - **Web Management**: Modern Vue.js interface with Vuex state management
            - **Database Storage**: PostgreSQL for DNS records, cache, and configuration
            - **Authentication**: JWT-based authentication with role-based access
            - **Caching**: Intelligent DNS caching with configurable TTL
            - **Production Ready**: Static IP addressing and proper service management
            
            ### 🐳 Docker Compose
            
            ```yaml
            version: '3.8'
            services:
              postgres:
                image: postgres:15
                environment:
                  POSTGRES_DB: dns_server
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: postgres
                networks:
                  dns-network:
                    ipv4_address: 172.20.0.2
                    
              dns-server:
                image: judyandiealvarez/sins:${{ steps.get_version.outputs.version }}
                ports:
                  - "53:53/udp"
                  - "53:53/tcp"
                  - "80:80"
                networks:
                  dns-network:
                    ipv4_address: 172.20.0.3
                    
            networks:
              dns-network:
                driver: bridge
                ipam:
                  config:
                    - subnet: 172.20.0.0/16
            ```
            
            ### 🔒 Security
            
            This release has been scanned for vulnerabilities using Trivy.
            
            ### 📄 License
            
            This project is licensed under the MIT License.
          draft: false
          prerelease: false
