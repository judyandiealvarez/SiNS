name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Test and Create Tag"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  IMAGE_NAME: judyandiealvarez/sins

jobs:
  get-latest-tag:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: k3s-prod
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      has-new-tag: ${{ steps.tag.outputs.has-new-tag }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get latest tag
      id: tag
      run: |
        # Get the commit SHA from the triggering workflow run
        TRIGGERING_SHA="${{ github.event.workflow_run.head_sha }}"
        echo "Triggering workflow SHA: $TRIGGERING_SHA"
        
        # Fetch all tags
        git fetch --tags --force
        
        # Get the latest tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        LATEST_TAG_SHA=$(git rev-parse "$LATEST_TAG" 2>/dev/null || echo "")
        
        echo "Latest tag: $LATEST_TAG (SHA: $LATEST_TAG_SHA)"
        echo "Triggering workflow SHA: $TRIGGERING_SHA"
        
        # Check if the latest tag points to the triggering workflow's commit
        if [ "$LATEST_TAG_SHA" = "$TRIGGERING_SHA" ]; then
          echo "✅ Latest tag $LATEST_TAG was created by the triggering workflow"
          HAS_NEW_TAG="true"
        else
          echo "⚠️  Latest tag $LATEST_TAG does not match triggering workflow commit"
          HAS_NEW_TAG="false"
        fi
        
        VERSION=${LATEST_TAG#v}
        # Ensure tag format is correct (with 'refs/tags/' prefix for checkout)
        TAG_REF="refs/tags/$LATEST_TAG"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG_REF" >> $GITHUB_OUTPUT
        echo "has-new-tag=$HAS_NEW_TAG" >> $GITHUB_OUTPUT
        echo "Tag ref for checkout: $TAG_REF"

  test:
    runs-on: k3s-prod
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: [get-latest-tag]
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && needs.get-latest-tag.outputs.tag || github.ref }}
      
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
      env:
        DOTNET_INSTALL_DIR: $HOME/.dotnet
      
    - name: Add .NET to PATH
      run: |
        echo "$HOME/.dotnet" >> $GITHUB_PATH
      
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore
      
    - name: Test
      run: dotnet test --no-build --verbosity normal

  create-tag:
    needs: [test]
    if: false
    runs-on: k3s-prod
    environment: public
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Configure git remote with PAT token
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
      run: |
        if [ -n "$GH_TOKEN" ]; then
          echo "Configuring git remote with PAT token"
          git remote set-url origin https://$GH_TOKEN@github.com/${{ github.repository }}.git
        else
          echo "GH_TOKEN not available, using default authentication"
        fi
    
    - name: Fetch all tags
      run: |
        git fetch --tags --force
    
    - name: Extract version
      id: version
      run: |
        # Get latest tag or use 0.0.0
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        BASE_VERSION=${LATEST_TAG#v}
        # Increment patch version
        IFS='.' read -ra VERSION_PARTS <<< "$BASE_VERSION"
        MAJOR=${VERSION_PARTS[0]:-0}
        MINOR=${VERSION_PARTS[1]:-0}
        PATCH=${VERSION_PARTS[2]:-0}
        PATCH=$((PATCH + 1))
        VERSION="${MAJOR}.${MINOR}.${PATCH}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
    
    - name: Create git tag
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        TAG=${{ steps.version.outputs.tag }}
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, skipping"
        else
          git tag -a "$TAG" -m "Release $TAG"
          git remote set-url origin https://$GH_TOKEN@github.com/${{ github.repository }}.git
          git push origin "$TAG"
          echo "Tag $TAG created and pushed. Build jobs will run in this workflow."
        fi
    
    - name: Set version output for downstream jobs
      id: tag_version
      run: |
        echo "version=${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT

  build-server:
    needs: [test, get-latest-tag]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && needs.get-latest-tag.outputs.has-new-tag == 'true')
    runs-on: k3s-prod
    permissions:
      contents: read
    outputs:
      package-path: ${{ steps.package.outputs.path }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'workflow_run' && needs.get-latest-tag.outputs.tag || github.ref }}
    
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
      env:
        DOTNET_INSTALL_DIR: $HOME/.dotnet
        
    - name: Add .NET to PATH
      run: |
        echo "$HOME/.dotnet" >> $GITHUB_PATH
        
    - name: Setup build environment
      run: |
        sudo apt update || sudo apt update || true
        sudo apt install -y dpkg-dev build-essential fakeroot libcap2-bin || sudo apt install -y dpkg-dev build-essential fakeroot libcap2-bin
        
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION=${{ github.event.inputs.version }}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" == "workflow_run" ]; then
          VERSION="${{ needs.get-latest-tag.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
        
    - name: Build server application
      run: |
        cd sins
        echo "Building .NET application..."
        dotnet restore
        dotnet build -c Release --verbosity quiet
        echo "Build completed successfully"
        
    - name: Build Debian package
      run: |
        cd sins
        echo "Building Debian package..."
        echo "Version: ${{ steps.version.outputs.version }}"
        chmod +x build-package.sh
        ./build-package.sh ${{ steps.version.outputs.version }}
        echo "Package build completed"
        
    - name: Upload server package artifact
      id: package
      uses: actions/upload-artifact@v4
      with:
        name: sins-package
        path: sins/sins_${{ steps.version.outputs.version }}_amd64.deb
        retention-days: 30

  build-cli:
    needs: [test, get-latest-tag]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && needs.get-latest-tag.outputs.has-new-tag == 'true')
    runs-on: k3s-prod
    permissions:
      contents: read
    outputs:
      package-path: ${{ steps.package.outputs.path }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'workflow_run' && needs.get-latest-tag.outputs.tag || github.ref }}
    
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
      env:
        DOTNET_INSTALL_DIR: $HOME/.dotnet
        
    - name: Add .NET to PATH
      run: |
        echo "$HOME/.dotnet" >> $GITHUB_PATH
        
    - name: Setup build environment
      run: |
        sudo apt update || sudo apt update || true
        sudo apt install -y dpkg-dev build-essential fakeroot || sudo apt install -y dpkg-dev build-essential fakeroot
        
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION=${{ github.event.inputs.version }}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" == "workflow_run" ]; then
          VERSION="${{ needs.get-latest-tag.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
        
    - name: Build CLI application
      run: |
        cd sins-cli
        echo "Building .NET application..."
        dotnet restore
        dotnet build -c Release --verbosity quiet
        echo "Build completed successfully"
        
    - name: Test CLI application
      run: |
        cd sins-cli
        dotnet run -- --help
        
    - name: Build Debian package
      run: |
        cd sins-cli
        echo "Building Debian package..."
        echo "Version: ${{ steps.version.outputs.version }}"
        chmod +x build-package.sh
        ./build-package.sh ${{ steps.version.outputs.version }}
        echo "Package build completed"
        
    - name: Upload CLI package artifact
      id: package
      uses: actions/upload-artifact@v4
      with:
        name: sins-cli-package
        path: sins-cli/sins-cli_${{ steps.version.outputs.version }}_amd64.deb
        retention-days: 30

  deploy-server:
    needs: build-server
    runs-on: k3s-prod
    environment: public
    
    steps:
    - name: Download server package artifact
      uses: actions/download-artifact@v4
      with:
        name: sins-package
        path: .
        
    - name: Deploy to Gemfury
      env:
        GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        GEMFURY_USER: ${{ secrets.GEMFURY_USER }}
      run: |
        if [ -z "$GEMFURY_TOKEN" ] || [ -z "$GEMFURY_USER" ]; then
          echo "❌ GEMFURY_TOKEN or GEMFURY_USER secret is not set!"
          echo "Please add these secrets to your GitHub repository"
          exit 1
        fi
        
        echo "✅ Gemfury credentials are available"
        PACKAGE_FILE=$(ls -t *.deb | head -1)
        VERSION=$(echo $PACKAGE_FILE | sed 's/sins_\(.*\)_amd64.deb/\1/')
        echo "Deploying package: $PACKAGE_FILE (version: $VERSION) as public"
        curl -F package=@$PACKAGE_FILE \
          "https://$GEMFURY_TOKEN@push.fury.io/$GEMFURY_USER/?public=1"
        echo "✅ Package uploaded to Gemfury successfully as public!"

  deploy-cli:
    needs: build-cli
    runs-on: k3s-prod
    environment: public
    
    steps:
    - name: Download CLI package artifact
      uses: actions/download-artifact@v4
      with:
        name: sins-cli-package
        path: .
        
    - name: Deploy to Gemfury
      env:
        GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        GEMFURY_USER: ${{ secrets.GEMFURY_USER }}
      run: |
        if [ -z "$GEMFURY_TOKEN" ] || [ -z "$GEMFURY_USER" ]; then
          echo "❌ GEMFURY_TOKEN or GEMFURY_USER secret is not set!"
          echo "Please add these secrets to your GitHub repository"
          exit 1
        fi
        
        echo "✅ Gemfury credentials are available"
        PACKAGE_FILE=$(ls -t *.deb | head -1)
        VERSION=$(echo $PACKAGE_FILE | sed 's/sins-cli_\(.*\)_amd64.deb/\1/')
        echo "Deploying CLI package: $PACKAGE_FILE (version: $VERSION) as public"
        curl -F package=@$PACKAGE_FILE \
          "https://$GEMFURY_TOKEN@push.fury.io/$GEMFURY_USER/?public=1"
        echo "✅ CLI package uploaded to Gemfury successfully as public!"

  build-docker:
    runs-on: k3s-prod
    needs: [deploy-server, deploy-cli]
    environment: public
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT }}
      
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION=${{ github.event.inputs.version }}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        else
          # For main branch, use git describe to get version from latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMIT_COUNT=$(git rev-list --count ${LATEST_TAG}..HEAD 2>/dev/null || echo "0")
          BASE_VERSION=${LATEST_TAG#v}
          if [ "$COMMIT_COUNT" -gt "0" ]; then
            VERSION="${BASE_VERSION}.${COMMIT_COUNT}"
          else
            VERSION="$BASE_VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        registry: docker.io

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          APP_VERSION=${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        format: 'sarif'
        output: 'trivy-results.sarif'
      if: steps.version.outputs.version != ''

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  release:
    needs: [build-docker, build-server, build-cli, deploy-server, deploy-cli]
    runs-on: k3s-prod
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT }}
      
    - name: Download server package artifact
      uses: actions/download-artifact@v4
      with:
        name: sins-package
        path: packages/
        
    - name: Download CLI package artifact
      uses: actions/download-artifact@v4
      with:
        name: sins-cli-package
        path: packages/
        
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION=${{ github.event.inputs.version }}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          # For main branch, use git describe to get version from latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMIT_COUNT=$(git rev-list --count ${LATEST_TAG}..HEAD 2>/dev/null || echo "0")
          BASE_VERSION=${LATEST_TAG#v}
          if [ "$COMMIT_COUNT" -gt "0" ]; then
            VERSION="${BASE_VERSION}.${COMMIT_COUNT}"
          else
            VERSION="$BASE_VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        fi
        
    - name: Get changelog
      id: changelog
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        if [ -n "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --oneline --no-merges $PREVIOUS_TAG..HEAD | head -30)
        else
          CHANGELOG=$(git log --oneline --no-merges | head -30)
        fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Verify package files exist
      run: |
        echo "Checking package files..."
        ls -lh packages/
        SERVER_PKG=$(ls packages/sins_*.deb 2>/dev/null | head -1)
        CLI_PKG=$(ls packages/sins-cli_*.deb 2>/dev/null | head -1)
        
        if [ -z "$SERVER_PKG" ]; then
          echo "❌ Server package not found!"
          exit 1
        fi
        if [ -z "$CLI_PKG" ]; then
          echo "❌ CLI package not found!"
          exit 1
        fi
        
        echo "✅ Server package: $SERVER_PKG"
        echo "✅ CLI package: $CLI_PKG"
        echo "server_pkg=$SERVER_PKG" >> $GITHUB_ENV
        echo "cli_pkg=$CLI_PKG" >> $GITHUB_ENV
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      env:
        GEMFURY_USER: ${{ secrets.GEMFURY_USER }}
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: SiNS ${{ steps.version.outputs.version }}
        body: |
          ## SiNS (Simple Name Server) ${{ steps.version.outputs.version }}
          
          **SiNS** stands for **[Si]mple [N]ame [S]erver** - a complete DNS server solution with web-based management interface.
          
          ### 📦 Debian Packages
          
          This release includes both SiNS Server and CLI deb packages:
          
          - **sins_${{ steps.version.outputs.version }}_amd64.deb** - DNS server application
          - **sins-cli_${{ steps.version.outputs.version }}_amd64.deb** - Command-line interface tool
          
          ### 🚀 Installation
          
          **SiNS Server:**
          
          ```bash
          # From Gemfury APT repository
          curl -s https://get.fury.io/${{ secrets.GEMFURY_USER }} | bash
          sudo apt update
          sudo apt install sins
          
          # Or download from GitHub Releases and install
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/sins_${{ steps.version.outputs.version }}_amd64.deb
          sudo dpkg -i sins_${{ steps.version.outputs.version }}_amd64.deb
          sudo apt-get install -f
          ```
          
          **SiNS CLI (sns):**
          
          ```bash
          # From APT repository
          echo "deb http://tools.apt.home.net /" | sudo tee /etc/apt/sources.list.d/custom.list
          sudo apt update
          sudo apt install sins-cli
          
          # Or download from GitHub Releases and install
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/sins-cli_${{ steps.version.outputs.version }}_amd64.deb
          sudo dpkg -i sins-cli_${{ steps.version.outputs.version }}_amd64.deb
          sudo apt-get install -f
          ```
          
          ### 🚀 What's New
          
          ```
          ${{ steps.changelog.outputs.changelog }}
          ```
          
          ### 🔧 Features
          
          - **SiNS Hybrid DNS Server**: Authoritative and recursive DNS server
          - **Web Management**: Modern Vue.js interface with Vuex state management
          - **CLI Tool**: Command-line interface for server management
          - **Database Storage**: PostgreSQL for DNS records, cache, and configuration
          - **Authentication**: JWT-based authentication with role-based access
          - **Caching**: Intelligent DNS caching with configurable TTL
          - **Production Ready**: Static IP addressing and proper service management
          
          ### 📚 Documentation
          
          - [Installation Guide](https://github.com/${{ github.repository }}/blob/main/docs/installation.md)
          - [Quick Start](https://github.com/${{ github.repository }}/blob/main/docs/quick-start.md)
          - [API Reference](https://github.com/${{ github.repository }}/blob/main/docs/api-reference.md)
          - [Release Guide](https://github.com/${{ github.repository }}/blob/main/RELEASES.md)
          
          ### 🐳 Docker Image
          
          Docker image is also available:
          
          ```bash
          docker pull judyandiealvarez/sins:${{ steps.version.outputs.version }}
          ```
          
          ### 🐳 Docker Compose
          
          ```yaml
          version: '3.8'
          services:
            postgres:
              image: postgres:15
              environment:
                POSTGRES_DB: dns_server
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
              networks:
                dns-network:
                  ipv4_address: 172.20.0.2
                  
            dns-server:
              image: judyandiealvarez/sins:${{ steps.version.outputs.version }}
              ports:
                - "53:53/udp"
                - "53:53/tcp"
                - "80:80"
              networks:
                dns-network:
                  ipv4_address: 172.20.0.3
                  
          networks:
            dns-network:
              driver: bridge
              ipam:
                config:
                  - subnet: 172.20.0.0/16
          ```
          
          ### 🔒 Security
          
          This release has been scanned for vulnerabilities using Trivy.
        files: |
          packages/sins_${{ steps.version.outputs.version }}_amd64.deb
          packages/sins-cli_${{ steps.version.outputs.version }}_amd64.deb
        draft: false
        prerelease: false
