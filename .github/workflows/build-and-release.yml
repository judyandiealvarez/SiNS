name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  IMAGE_NAME: judyandiealvarez/sins

jobs:
  test:
    runs-on: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore
      
    - name: Test
      run: dotnet test --no-build --verbosity normal

  create-tag:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: docker-build
    environment: public
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
    
    - name: Extract version
      id: version
      run: |
        # Get latest tag or use 0.0.0
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        BASE_VERSION=${LATEST_TAG#v}
        # Increment patch version
        IFS='.' read -ra VERSION_PARTS <<< "$BASE_VERSION"
        MAJOR=${VERSION_PARTS[0]:-0}
        MINOR=${VERSION_PARTS[1]:-0}
        PATCH=${VERSION_PARTS[2]:-0}
        PATCH=$((PATCH + 1))
        VERSION="${MAJOR}.${MINOR}.${PATCH}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
    
    - name: Create git tag
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        TAG=${{ steps.version.outputs.tag }}
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, skipping"
        else
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
        fi
    
    - name: Trigger workflow for tag
      if: steps.version.outputs.tag != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GH_PAT }}
        script: |
          const tag = '${{ steps.version.outputs.tag }}';
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          
          // Wait for tag to be available
          await new Promise(resolve => setTimeout(resolve, 2000));
          
          try {
            // Get workflows - correct method is listRepoWorkflows
            const response = await github.rest.actions.listRepoWorkflows({
              owner: owner,
              repo: repo,
              per_page: 100
            });
            
            // Response structure: response.data.workflows is an array
            if (!response || !response.data || !Array.isArray(response.data.workflows)) {
              throw new Error('Invalid API response structure');
            }
            
            // Find the workflow file
            const workflowFile = 'build-and-release.yml';
            const workflow = response.data.workflows.find(w => 
              w.path === `.github/workflows/${workflowFile}`
            );
            
            if (!workflow) {
              console.log(`⚠️ Workflow ${workflowFile} not found`);
              console.log(`Tag ${tag} was created. Workflow should trigger automatically from tag push.`);
              return;
            }
            
            if (!workflow.id) {
              throw new Error('Workflow found but missing ID');
            }
            
            // Trigger workflow dispatch with tag as ref
            await github.rest.actions.createWorkflowDispatch({
              owner: owner,
              repo: repo,
              workflow_id: workflow.id,
              ref: tag
            });
            
            console.log(`✅ Successfully triggered workflow for tag ${tag}`);
            
          } catch (error) {
            console.log(`⚠️ Could not trigger workflow via API`);
            console.log(`Tag ${tag} was created and pushed.`);
            console.log(`Workflow should trigger automatically from tag push since GH_PAT was used.`);
            console.log(`Error: ${error.message}`);
            if (error.response) {
              console.log(`HTTP Status: ${error.response.status}`);
            }
            // Don't fail the step - tag was created successfully
          }
    
    - name: Verify tag creation
      if: steps.version.outputs.tag != '' && secrets.GH_PAT == ''
      run: |
        TAG=${{ steps.version.outputs.tag }}
        echo "✅ Tag $TAG was created and pushed"
        echo "⚠️ GH_PAT secret is not configured"
        echo "⚠️ Without PAT, tag pushes from workflows don't trigger new workflow runs"
        echo "⚠️ Add a PAT token with 'workflow' scope as GH_PAT secret for automatic triggering"
      
  build-docker:
    runs-on: docker-build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test]
    environment: public
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION=${{ github.event.inputs.version }}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        else
          # For main branch, use git describe to get version from latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMIT_COUNT=$(git rev-list --count ${LATEST_TAG}..HEAD 2>/dev/null || echo "0")
          BASE_VERSION=${LATEST_TAG#v}
          if [ "$COMMIT_COUNT" -gt "0" ]; then
            VERSION="${BASE_VERSION}.${COMMIT_COUNT}"
          else
            VERSION="$BASE_VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        registry: docker.io

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        format: 'sarif'
        output: 'trivy-results.sarif'
      if: steps.version.outputs.version != ''

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  build-server:
    runs-on: docker-build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test]
    outputs:
      package-path: ${{ steps.package.outputs.path }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check .NET
      run: |
        dotnet --version
        echo "Using existing .NET installation on docker-build runner"
        
    - name: Setup build environment
      run: |
        sudo apt update
        sudo apt install -y dpkg-dev build-essential fakeroot libcap2-bin
        
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION=${{ github.event.inputs.version }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          # Extract version from git tag (remove 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        else
          # For main branch, use git describe to get version from latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMIT_COUNT=$(git rev-list --count ${LATEST_TAG}..HEAD 2>/dev/null || echo "0")
          BASE_VERSION=${LATEST_TAG#v}
          if [ "$COMMIT_COUNT" -gt "0" ]; then
            VERSION="${BASE_VERSION}.${COMMIT_COUNT}"
          else
            VERSION="$BASE_VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
        
    - name: Build server application
      run: |
        cd sins
        echo "Building .NET application..."
        dotnet restore
        dotnet build -c Release --verbosity quiet
        echo "Build completed successfully"
        
    - name: Build Debian package
      run: |
        cd sins
        echo "Building Debian package..."
        echo "Version: ${{ steps.version.outputs.version }}"
        chmod +x build-package.sh
        ./build-package.sh ${{ steps.version.outputs.version }}
        echo "Package build completed"
        
    - name: Upload server package artifact
      id: package
      uses: actions/upload-artifact@v4
      with:
        name: sins-package
        path: sins/sins_${{ steps.version.outputs.version }}_amd64.deb
        retention-days: 30

  build-cli:
    runs-on: docker-build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test]
    outputs:
      package-path: ${{ steps.package.outputs.path }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check .NET
      run: |
        dotnet --version
        echo "Using existing .NET installation on docker-build runner"
        
    - name: Setup build environment
      run: |
        sudo apt update
        sudo apt install -y dpkg-dev build-essential fakeroot
        
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION=${{ github.event.inputs.version }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          # Extract version from git tag (remove 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        else
          # For main branch, use git describe to get version from latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMIT_COUNT=$(git rev-list --count ${LATEST_TAG}..HEAD 2>/dev/null || echo "0")
          BASE_VERSION=${LATEST_TAG#v}
          if [ "$COMMIT_COUNT" -gt "0" ]; then
            VERSION="${BASE_VERSION}.${COMMIT_COUNT}"
          else
            VERSION="$BASE_VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
        
    - name: Build CLI application
      run: |
        cd sins-cli
        echo "Building .NET application..."
        dotnet restore
        dotnet build -c Release --verbosity quiet
        echo "Build completed successfully"
        
    - name: Test CLI application
      run: |
        cd sins-cli
        dotnet run -- --help
        
    - name: Build Debian package
      run: |
        cd sins-cli
        echo "Building Debian package..."
        echo "Version: ${{ steps.version.outputs.version }}"
        chmod +x build-package.sh
        ./build-package.sh ${{ steps.version.outputs.version }}
        echo "Package build completed"
        
    - name: Upload CLI package artifact
      id: package
      uses: actions/upload-artifact@v4
      with:
        name: sins-cli-package
        path: sins-cli/sins-cli_${{ steps.version.outputs.version }}_amd64.deb
        retention-days: 30

  deploy-server:
    needs: build-server
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: docker-build
    environment: public
    
    steps:
    - name: Download server package artifact
      uses: actions/download-artifact@v4
      with:
        name: sins-package
        path: .
        
    - name: Deploy to Gemfury
      env:
        GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        GEMFURY_USER: ${{ secrets.GEMFURY_USER }}
      run: |
        if [ -z "$GEMFURY_TOKEN" ] || [ -z "$GEMFURY_USER" ]; then
          echo "❌ GEMFURY_TOKEN or GEMFURY_USER secret is not set!"
          echo "Please add these secrets to your GitHub repository"
          exit 1
        fi
        
        echo "✅ Gemfury credentials are available"
        PACKAGE_FILE=$(ls -t *.deb | head -1)
        VERSION=$(echo $PACKAGE_FILE | sed 's/sins_\(.*\)_amd64.deb/\1/')
        echo "Deploying package: $PACKAGE_FILE (version: $VERSION)"
        curl -F package=@$PACKAGE_FILE \
          https://$GEMFURY_TOKEN@push.fury.io/$GEMFURY_USER/
        echo "✅ Package uploaded to Gemfury successfully!"

  deploy-cli:
    needs: build-cli
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: docker-build
    environment: public
    
    steps:
    - name: Download CLI package artifact
      uses: actions/download-artifact@v4
      with:
        name: sins-cli-package
        path: .
        
    - name: Deploy to Gemfury
      env:
        GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        GEMFURY_USER: ${{ secrets.GEMFURY_USER }}
      run: |
        if [ -z "$GEMFURY_TOKEN" ] || [ -z "$GEMFURY_USER" ]; then
          echo "❌ GEMFURY_TOKEN or GEMFURY_USER secret is not set!"
          echo "Please add these secrets to your GitHub repository"
          exit 1
        fi
        
        echo "✅ Gemfury credentials are available"
        PACKAGE_FILE=$(ls -t *.deb | head -1)
        VERSION=$(echo $PACKAGE_FILE | sed 's/sins-cli_\(.*\)_amd64.deb/\1/')
        echo "Deploying CLI package: $PACKAGE_FILE (version: $VERSION) as public"
        curl -F package=@$PACKAGE_FILE \
          "https://$GEMFURY_TOKEN@push.fury.io/$GEMFURY_USER/?public=1"
        echo "✅ CLI package uploaded to Gemfury successfully as public!"

  release:
    needs: [build-docker, build-server, build-cli, deploy-server, deploy-cli]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: docker-build
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download server package artifact
      uses: actions/download-artifact@v4
      with:
        name: sins-package
        path: packages/
        
    - name: Download CLI package artifact
      uses: actions/download-artifact@v4
      with:
        name: sins-cli-package
        path: packages/
        
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION=${{ github.event.inputs.version }}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          # For main branch, use git describe to get version from latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMIT_COUNT=$(git rev-list --count ${LATEST_TAG}..HEAD 2>/dev/null || echo "0")
          BASE_VERSION=${LATEST_TAG#v}
          if [ "$COMMIT_COUNT" -gt "0" ]; then
            VERSION="${BASE_VERSION}.${COMMIT_COUNT}"
          else
            VERSION="$BASE_VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        fi
        
    - name: Get changelog
      id: changelog
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        if [ -n "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --oneline --no-merges $PREVIOUS_TAG..HEAD | head -30)
        else
          CHANGELOG=$(git log --oneline --no-merges | head -30)
        fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Verify package files exist
      run: |
        echo "Checking package files..."
        ls -lh packages/
        SERVER_PKG=$(ls packages/sins_*.deb 2>/dev/null | head -1)
        CLI_PKG=$(ls packages/sins-cli_*.deb 2>/dev/null | head -1)
        
        if [ -z "$SERVER_PKG" ]; then
          echo "❌ Server package not found!"
          exit 1
        fi
        if [ -z "$CLI_PKG" ]; then
          echo "❌ CLI package not found!"
          exit 1
        fi
        
        echo "✅ Server package: $SERVER_PKG"
        echo "✅ CLI package: $CLI_PKG"
        echo "server_pkg=$SERVER_PKG" >> $GITHUB_ENV
        echo "cli_pkg=$CLI_PKG" >> $GITHUB_ENV
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      env:
        GEMFURY_USER: ${{ secrets.GEMFURY_USER }}
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: SiNS ${{ steps.version.outputs.version }}
        body: |
          ## SiNS (Simple Name Server) ${{ steps.version.outputs.version }}
          
          **SiNS** stands for **[Si]mple [N]ame [S]erver** - a complete DNS server solution with web-based management interface.
          
          ### 📦 Debian Packages
          
          This release includes both SiNS Server and CLI deb packages:
          
          - **sins_${{ steps.version.outputs.version }}_amd64.deb** - DNS server application
          - **sins-cli_${{ steps.version.outputs.version }}_amd64.deb** - Command-line interface tool
          
          ### 🚀 Installation
          
          **SiNS Server:**
          
          ```bash
          # From Gemfury APT repository
          curl -s https://get.fury.io/${{ secrets.GEMFURY_USER }} | bash
          sudo apt update
          sudo apt install sins
          
          # Or download from GitHub Releases and install
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/sins_${{ steps.version.outputs.version }}_amd64.deb
          sudo dpkg -i sins_${{ steps.version.outputs.version }}_amd64.deb
          sudo apt-get install -f
          ```
          
          **SiNS CLI (sns):**
          
          ```bash
          # From APT repository
          echo "deb http://tools.apt.home.net /" | sudo tee /etc/apt/sources.list.d/custom.list
          sudo apt update
          sudo apt install sins-cli
          
          # Or download from GitHub Releases and install
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/sins-cli_${{ steps.version.outputs.version }}_amd64.deb
          sudo dpkg -i sins-cli_${{ steps.version.outputs.version }}_amd64.deb
          sudo apt-get install -f
          ```
          
          ### 🚀 What's New
          
          ```
          ${{ steps.changelog.outputs.changelog }}
          ```
          
          ### 🔧 Features
          
          - **SiNS Hybrid DNS Server**: Authoritative and recursive DNS server
          - **Web Management**: Modern Vue.js interface with Vuex state management
          - **CLI Tool**: Command-line interface for server management
          - **Database Storage**: PostgreSQL for DNS records, cache, and configuration
          - **Authentication**: JWT-based authentication with role-based access
          - **Caching**: Intelligent DNS caching with configurable TTL
          - **Production Ready**: Static IP addressing and proper service management
          
          ### 📚 Documentation
          
          - [Installation Guide](https://github.com/${{ github.repository }}/blob/main/docs/installation.md)
          - [Quick Start](https://github.com/${{ github.repository }}/blob/main/docs/quick-start.md)
          - [API Reference](https://github.com/${{ github.repository }}/blob/main/docs/api-reference.md)
          - [Release Guide](https://github.com/${{ github.repository }}/blob/main/RELEASES.md)
          
          ### 🐳 Docker Image
          
          Docker image is also available:
          
          ```bash
          docker pull judyandiealvarez/sins:${{ steps.version.outputs.version }}
          ```
          
          ### 🐳 Docker Compose
          
          ```yaml
          version: '3.8'
          services:
            postgres:
              image: postgres:15
              environment:
                POSTGRES_DB: dns_server
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
              networks:
                dns-network:
                  ipv4_address: 172.20.0.2
                  
            dns-server:
              image: judyandiealvarez/sins:${{ steps.version.outputs.version }}
              ports:
                - "53:53/udp"
                - "53:53/tcp"
                - "80:80"
              networks:
                dns-network:
                  ipv4_address: 172.20.0.3
                  
          networks:
            dns-network:
              driver: bridge
              ipam:
                config:
                  - subnet: 172.20.0.0/16
          ```
          
          ### 🔒 Security
          
          This release has been scanned for vulnerabilities using Trivy.
        files: |
          packages/sins_${{ steps.version.outputs.version }}_amd64.deb
          packages/sins-cli_${{ steps.version.outputs.version }}_amd64.deb
        draft: false
        prerelease: false

