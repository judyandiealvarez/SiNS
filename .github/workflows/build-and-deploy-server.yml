name: Build and Deploy SiNS Server

on:
  push:
    tags:
      - 'server-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: docker-build
    outputs:
      package-path: ${{ steps.package.outputs.path }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check .NET
      run: |
        dotnet --version
        echo "Using existing .NET installation on docker-build runner"
        
    - name: Setup build environment
      run: |
        sudo apt update
        sudo apt install -y dpkg-dev build-essential fakeroot libcap2-bin
        
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          # Extract version from git tag (remove 'server-v' prefix)
          VERSION=${GITHUB_REF#refs/tags/server-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi
        
    - name: Build server application
      run: |
        cd sins
        echo "Current directory: $(pwd)"
        echo "Building .NET application..."
        dotnet restore
        dotnet build -c Release --verbosity quiet
        echo "Build completed successfully"
        
    - name: Build Debian package
      run: |
        cd sins
        echo "Building Debian package..."
        echo "Version: ${{ steps.version.outputs.version }}"
        chmod +x build-package.sh
        ./build-package.sh ${{ steps.version.outputs.version }}
        echo "Package build completed"
        
    - name: Verify package
      run: |
        cd sins
        echo "Package contents:"
        dpkg -c sins-server_${{ steps.version.outputs.version }}_amd64.deb
        
        echo "Package information:"
        dpkg -I sins-server_${{ steps.version.outputs.version }}_amd64.deb
        
    - name: Upload package artifact
      id: package
      uses: actions/upload-artifact@v4
      with:
        name: sins-server-package
        path: sins/sins-server_${{ steps.version.outputs.version }}_amd64.deb
        retention-days: 30
        
  deploy:
    needs: build
    runs-on: docker-build
    environment: public
    
    steps:
    - name: Download package artifact
      uses: actions/download-artifact@v4
      with:
        name: sins-server-package
        path: .
        
    - name: Deploy to Gemfury
      env:
        GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        GEMFURY_USER: ${{ secrets.GEMFURY_USER }}
      run: |
        # Check if secrets are set
        if [ -z "$GEMFURY_TOKEN" ] || [ -z "$GEMFURY_USER" ]; then
          echo "❌ GEMFURY_TOKEN or GEMFURY_USER secret is not set!"
          echo "Please add these secrets to your GitHub repository:"
          echo "  - Settings → Secrets and variables → Actions → New repository secret"
          exit 1
        fi
        
        echo "✅ Gemfury credentials are available"
        
        # Get the package filename
        PACKAGE_FILE=$(ls -t *.deb | head -1)
        VERSION=$(echo $PACKAGE_FILE | sed 's/sins-server_\(.*\)_amd64.deb/\1/')
        
        echo "Deploying package: $PACKAGE_FILE (version: $VERSION)"
        
        # Upload to Gemfury using curl
        curl -F package=@$PACKAGE_FILE \
          https://$GEMFURY_TOKEN@push.fury.io/$GEMFURY_USER/
        
        echo "✅ Package uploaded to Gemfury successfully!"
        
    - name: Verify deployment
      env:
        GEMFURY_USER: ${{ secrets.GEMFURY_USER }}
      run: |
        # Wait a moment for repository to update
        sleep 5
        
        # Check if package is available in repository
        echo "Checking package availability..."
        if [ -n "$GEMFURY_USER" ]; then
          curl -s "https://apt.fury.io/$GEMFURY_USER/Packages" | grep -A 5 "Package: sins-server" || echo "Package not found in repository yet (may take a few minutes)"
        fi
        
    - name: Notify deployment
      env:
        GEMFURY_USER: ${{ secrets.GEMFURY_USER }}
      run: |
        PACKAGE_FILE=$(ls *.deb)
        VERSION=$(echo $PACKAGE_FILE | sed 's/sins-server_\(.*\)_amd64.deb/\1/')
        
        echo "✅ SiNS Server package deployed successfully!"
        echo "📦 Package: $PACKAGE_FILE"
        echo "🌐 Repository: https://apt.fury.io/$GEMFURY_USER/"
        echo ""
        echo "📋 To install on a Debian/Ubuntu system:"
        echo "   curl -s https://get.fury.io/$GEMFURY_USER | bash"
        echo "   sudo apt update"
        echo "   sudo apt install sins-server"
        echo ""
        echo "Or manually add repository:"
        echo "   echo \"deb https://$GEMFURY_USER@apt.fury.io/$GEMFURY_USER /\" | sudo tee /etc/apt/sources.list.d/fury.list"
        echo "   sudo apt update"
        echo "   sudo apt install sins-server"
        
  release:
    needs: [build, deploy]
    runs-on: docker-build
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download package artifact
      uses: actions/download-artifact@v4
      with:
        name: sins-server-package
        path: .
        
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "tag=server-v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          VERSION=${GITHUB_REF#refs/tags/server-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: Get changelog
      id: changelog
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        if [ -n "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --oneline --no-merges $PREVIOUS_TAG..HEAD | head -20)
        else
          CHANGELOG=$(git log --oneline --no-merges | head -20)
        fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Verify package file exists
      run: |
        PACKAGE_FILE="sins-server_${{ steps.version.outputs.version }}_amd64.deb"
        if [ ! -f "$PACKAGE_FILE" ]; then
          echo "❌ Package file not found: $PACKAGE_FILE"
          echo "Current directory: $(pwd)"
          echo "Files in directory:"
          ls -la
          exit 1
        fi
        echo "✅ Package file found: $PACKAGE_FILE"
        ls -lh "$PACKAGE_FILE"
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: SiNS Server ${{ steps.version.outputs.version }}
        body: |
          ## SiNS Server ${{ steps.version.outputs.version }}
          
          ### 📦 Debian Package
          
          Download and install the Debian package:
          
          ```bash
          # Install from Gemfury APT repository
          curl -s https://get.fury.io/${{ secrets.GEMFURY_USER }} | bash
          sudo apt update
          sudo apt install sins-server
          ```
          
          ### 🚀 What's New
          
          ```
          ${{ steps.changelog.outputs.changelog }}
          ```
          
          ### 📋 Installation
          
          **From Gemfury:**
          ```bash
          curl -s https://get.fury.io/${{ secrets.GEMFURY_USER }} | bash
          sudo apt update
          sudo apt install sins-server
          ```
          
          **Manual Repository Setup:**
          ```bash
          echo "deb https://${{ secrets.GEMFURY_USER }}@apt.fury.io/${{ secrets.GEMFURY_USER }} /" | sudo tee /etc/apt/sources.list.d/fury.list
          sudo apt update
          sudo apt install sins-server
          ```
          
          ### 🔧 Features
          
          - Hybrid authoritative and recursive DNS server
          - Web-based management interface
          - PostgreSQL database storage
          - JWT-based authentication
          - Intelligent DNS caching
          - Systemd service integration
          
          ### 📄 Documentation
          
          - [Installation Guide](https://github.com/${{ github.repository }}/blob/main/docs/installation.md)
          - [Quick Start](https://github.com/${{ github.repository }}/blob/main/docs/quick-start.md)
        files: |
          sins-server_${{ steps.version.outputs.version }}_amd64.deb
        draft: false
        prerelease: false

