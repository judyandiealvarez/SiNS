global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend https_frontend
    bind *:443 ssl crt /etc/ssl/certs/certa-wildcard.pem
    
    # Host header matching for ns.home.net
    acl host_ns_home hdr(host) -i ns.home.net
    
    # Route to backend
    use_backend sins_backend if host_ns_home
    
    # Default backend for unmatched hosts
    default_backend sins_backend

backend sins_backend
    balance roundrobin
    server sins 127.0.0.1:80
