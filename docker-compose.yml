version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dns-postgres
    environment:
      POSTGRES_DB: dns_server
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      dns-network:
        ipv4_address: 172.20.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dns_server"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dns-server:
    image: judyandiealvarez/sins:latest
    container_name: dns-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "80:80"
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./sins/wwwroot:/app/wwwroot
    networks:
      dns-network:
        ipv4_address: 172.20.0.3
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    user: "0"
    privileged: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  dns-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
